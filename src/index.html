<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Grunt</title>
    <link rel="stylesheet" href="@@ENDERECO_DO_CSS">
</head>
<body>
    <main>
        <h1>Exercício Grunt</h1>
        <form id="form">
            <div>
                <input id="nome" type="text" placeholder="Nome" required>
                <input id="tel" type="tel" placeholder="(**) *****-****" required maxlength="11">
            </div>
            <button type="submit">Enviar</button>
        </form>
        <div class="sucesso">
            Seu nome <span id="name"></span> e seu telefone <span id="phone"></span> foram enviados
        </div>
    </main>

    <script src="@@ENDERECO_DO_JS"></script>
</body>
</html>
